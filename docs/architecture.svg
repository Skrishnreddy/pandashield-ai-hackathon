<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>PandaShield AI Hackathon Edition architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="hdr" x1="0" x2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
  </defs>
  <rect width="1200" height="640" fill="#0b1220"/>
  <text x="40" y="44" fill="#e6ecf5" font-size="26" font-weight="800">PandaShield AI · Hackathon Edition</text>
  <text x="40" y="66" fill="#8b9ab5" font-size="15">Scanner-verified findings, triaged by Gemini, on Google Cloud</text>

  <!-- Browser -->
  <rect x="40" y="130" width="250" height="300" rx="16" fill="#0f172a" stroke="#2a3858"/>
  <text x="60" y="162" fill="#e6ecf5" font-size="17" font-weight="700">Browser</text>
  <text x="60" y="186" fill="#8b9ab5" font-size="13">React + Vite SPA</text>
  <rect x="60" y="206" width="210" height="44" rx="10" fill="#131d33"/><text x="74" y="233" fill="#e6ecf5" font-size="13">Firebase Web SDK: Auth</text>
  <rect x="60" y="260" width="210" height="44" rx="10" fill="#131d33"/><text x="74" y="287" fill="#e6ecf5" font-size="13">Firestore live history (read-only)</text>
  <rect x="60" y="314" width="210" height="44" rx="10" fill="#131d33"/><text x="74" y="341" fill="#e6ecf5" font-size="13">Scan, review, fix, ask, export</text>
  <text x="60" y="400" fill="#8b9ab5" font-size="12">HTTPS + Firebase ID token</text>

  <!-- Cloud Run -->
  <rect x="380" y="110" width="440" height="420" rx="18" fill="#0f172a" stroke="url(#hdr)" stroke-width="2"/>
  <text x="404" y="144" fill="#e6ecf5" font-size="18" font-weight="800">Cloud Run · pandashield-hackathon</text>
  <text x="404" y="166" fill="#8b9ab5" font-size="13">Node.js / Express · own service account · asia-south1</text>
  <rect x="404" y="186" width="392" height="42" rx="10" fill="#131d33"/><text x="420" y="212" fill="#e6ecf5" font-size="13">1 · Verify Firebase ID token · validation · rate limits</text>
  <rect x="404" y="238" width="392" height="96" rx="10" fill="#131d33"/>
  <text x="420" y="262" fill="#e6ecf5" font-size="13" font-weight="700">2 · Deterministic scanners (code is never executed)</text>
  <text x="420" y="284" fill="#8b9ab5" font-size="12">• 35 SAST rules: injection, XSS, SSRF, deserialisation, crypto…</text>
  <text x="420" y="304" fill="#8b9ab5" font-size="12">• Secret detection, values redacted before storage and AI</text>
  <text x="420" y="324" fill="#8b9ab5" font-size="12">• Dependency CVEs (npm, PyPI) from OSV.dev</text>
  <rect x="404" y="344" width="392" height="76" rx="10" fill="#1c1838" stroke="#a78bfa"/>
  <text x="420" y="368" fill="#ddd6fe" font-size="13" font-weight="700">3 · Gemini triage (structured JSON)</text>
  <text x="420" y="390" fill="#c4b5fd" font-size="12">explanation · attack scenario · priority P1–P4 · fixed code</text>
  <text x="420" y="408" fill="#c4b5fd" font-size="12">invented findings discarded · follow-up Q&amp;A per finding</text>
  <rect x="404" y="430" width="392" height="42" rx="10" fill="#131d33"/><text x="420" y="456" fill="#e6ecf5" font-size="13">4 · Persist results · Markdown / SARIF reports</text>
  <text x="404" y="508" fill="#8b9ab5" font-size="12">Serves the SPA and the /api routes from one container</text>

  <!-- Google services (rows aligned with the steps they serve) -->
  <rect x="900" y="180" width="260" height="62" rx="14" fill="#2a1f0b" stroke="#f59e0b"/>
  <text x="920" y="206" fill="#fef3c7" font-size="16" font-weight="700">Firebase Authentication</text>
  <text x="920" y="228" fill="#fde68a" font-size="12">Google sign-in · ID tokens</text>

  <rect x="900" y="252" width="260" height="76" rx="14" fill="#0f172a" stroke="#2a3858"/>
  <text x="920" y="282" fill="#e6ecf5" font-size="16" font-weight="700">Public sources</text>
  <text x="920" y="306" fill="#8b9ab5" font-size="12">OSV.dev API · GitHub archives</text>

  <rect x="900" y="344" width="260" height="76" rx="14" fill="#1c1838" stroke="#a78bfa"/>
  <text x="920" y="372" fill="#ede9fe" font-size="16" font-weight="700">Gemini 3.8 Flash</text>
  <text x="920" y="396" fill="#c4b5fd" font-size="12">Vertex AI · IAM, no API keys</text>

  <rect x="900" y="430" width="260" height="100" rx="14" fill="#0f2a22" stroke="#34d399"/>
  <text x="920" y="458" fill="#d1fae5" font-size="16" font-weight="700">Cloud Firestore</text>
  <text x="920" y="480" fill="#a7f3d0" font-size="12">users/{uid}/scans/{id}/findings/{fid}</text>
  <text x="920" y="500" fill="#a7f3d0" font-size="12">rules: owner read, no client writes</text>

  <!-- arrows -->
  <line x1="290" y1="330" x2="378" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="796" y1="207" x2="898" y2="207" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="796" y1="290" x2="898" y2="290" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="796" y1="382" x2="898" y2="382" stroke="#a78bfa" stroke-width="2" marker-end="url(#a)"/>
  <line x1="796" y1="451" x2="898" y2="451" stroke="#34d399" stroke-width="2" marker-end="url(#a)"/>
  <path d="M165 130 C165 70 1030 60 1030 178" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#a)"/>
  <text x="560" y="78" fill="#fbbf24" font-size="12">Google sign-in (browser to Firebase Auth)</text>
  <path d="M165 430 C165 610 1030 620 1030 532" fill="none" stroke="#34d399" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#a)"/>
  <text x="470" y="604" fill="#34d399" font-size="12">live read of own scan history (Firestore security rules)</text>
</svg>
